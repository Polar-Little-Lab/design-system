name: Verify design system
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- src/tokens.css adapters/qt/src/polar_ui/tokens.json
      - run: cmp docs/AI_HANDOFF.md public/AI_HANDOFF.md
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: polar-ui-storybook
          path: storybook-static
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: storybook-static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
  qt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e adapters/qt
      - run: python -m unittest discover -s adapters/qt/tests -v
        env:
          QT_QPA_PLATFORM: offscreen

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [storybook, qt]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Storybook
        id: deployment
        uses: actions/deploy-pages@v4
